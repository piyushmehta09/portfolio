        </div>

      </div>
    </div>
  </div>

  <div class="content-wrapper">
    <div id="navbar-placeholder"></div>
    <div id="hero-placeholder"></div>
    <div id="about-placeholder"></div>
    <div id="projects-placeholder"></div>
    <div id="skills-placeholder"></div>
    <div id="contact-placeholder"></div>
    <div id="footer-placeholder"></div>
  </div>

  <script>
    async function loadComponent(id, file) {
      try {
        const response = await fetch(`components/${file}`);
        if (!response.ok) throw new Error(`Failed to load ${file}`);
        const content = await response.text();
        document.getElementById(id).innerHTML = content;
      } catch (err) {
        console.error(err);
      }
    }

    // Load all components sequentially
    async function init() {
      await Promise.all([
        loadComponent('navbar-placeholder', 'navbar.html'),
        loadComponent('hero-placeholder', 'hero.html'),
        loadComponent('about-placeholder', 'about.html'),
        loadComponent('projects-placeholder', 'projects.html'),
        loadComponent('skills-placeholder', 'skills.html'),
        loadComponent('contact-placeholder', 'contact.html'),
        loadComponent('footer-placeholder', 'footer.html')
      ]);
      
      console.log("All components loaded successfully.");
      
      // Initialize main script after components are ready
      if (typeof initializeMainScript === "function") {
        initializeMainScript();
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

  <script src="script.js"></script>
</body>
